[global]

# Аудит
max log size = 0
vfs object = full_audit
log level = 0 vfs:2
full_audit:prefix = %u|%I
full_audit:success = connect, open, close, pread, pwrite
full_audit:failure = connect, open, pwrite
syslog = 1
host msdfs = yes
case sensitive = no
default case = lower
preserve case = yes

workgroup = SADKOMED
server string = %h server (Samba, Ubuntu)
dns proxy = no
log file = /var/log/samba/log.%m
max log size = 1000

panic action = /usr/share/samba/panic-action %d
server role = standalone server
passdb backend = tdbsam
obey pam restrictions = yes
unix password sync = no
guest account = nobody
passwd program = /usr/bin/passwd %u
passwd chat = *Enter\snew\s*\spassword:* %n\n *Retype\snew\s*\spassword:* %n\n *password\supdated\ssuccessfully* .
map to guest = bad user
usershare allow guests = yes
security = user

[tw]
path = /mnt/share/f04-tw
browseable = no
comment = xray TW
create mask = 0660
directory mask = 0770
readonly = No
guest ok = Yes
case sensitive = True
default case = upper
preserve case = no
short preserve case = no
recycle:exclude = *.tmp *.temp *.o *.obj ~$*
recycle:keeptree = True
recycle:touch = True
recycle:touch_mtime = Yes
recycle:versions = True
recycle:noversions = .doc|.xls|.ppt
recycle:maxsize = 10000000
recycle:directory_mode = 0770
recycle:minsize = 1
vfs objects = recycle
recycle:repository = .recycle
veto oplock files = /*.cdx/*.dbf/*.fpt/*.fpg/
veto files = /*.bat/*.EXE/*.COM/*.BAT/*.INF/*.DLL/*.HTT/*.INI/*.avi/*.mp3/*.wav/*.mpg/*.cpl/*.js/*.jse/*.msh/*.msi/*.mps/*.ocx/*.pif/*.pl/*.src/*.vb/*.vbs/*.wsf/*.wsh/*.cmd/*.acm/*.dll/*.sys/*.vxd/*.swf/*.jpg/*.gif/*.bmp/
delete veto files = yes

