# Drop-in для firebird.service (юнит создаёт установщик Firebird 5).
# Пока Firebird не установлен — файл просто лежит и ни на что не влияет.
# Кладётся в /etc/systemd/system/firebird.service.d/limits.conf
[Unit]
# Не стартовать Firebird, пока не смонтирован диск с базами
RequiresMountsFor=/mnt/db
After=fb-disks.service

[Service]
LimitNOFILE=65536
LimitNPROC=65536
