[tw]
path = /mnt/hdd-fast/local/SHARE/tw/1
browseable = no
comment = xray TW
create mask = 0660
directory mask = 0770
readonly = No
guest ok = Yes
# в  соответствии с рекоменцдациями самба в больших директориях http://us3.samba.org/samba/ftp/HOWTO/Samba-LargeDirectory-HOWTO
# введены следующии инструкции
#I've been working (inspired by James Peach of SGI) on the
#problem of using Samba3 with applications that need large
##numbers of files (100,000 or more) per directory.
case sensitive = True
default case = upper
preserve case = no
short preserve case = no
# предпологаю что выше преведенные параметря связанные с проверкой  case могут привести к пробтемам возможно прийдется перекопировать всю базу
#также возможно потребуется
#oplocks = yes
#oplocks contention limit = количество_одновременно_работающих_с_базой_рользователей
## recycle bin add-in start
recycle:exclude = *.tmp *.temp *.o *.obj ~$*
recycle:keeptree = True
recycle:touch = True
recycle:touch_mtime     = Yes
recycle:versions = True
recycle:noversions = .doc|.xls|.ppt
recycle:maxsize = 10000000
recycle:directory_mode  = 0770
recycle:minsize         = 1
vfs objects = recycle
recycle:repository = .recycle
## recycle bin add-in end
veto oplock files = /*.cdx/*.dbf/*.fpt/*.fpg/
veto files = /*.bat/*.EXE/*.COM/*.BAT/*.INF/*.DLL/*.HTT/*.INI/*.avi/*.mp3/*.wav/*.mpg/*.cpl/*.js/*.jse/*.msh/*.msi/*.mps/*.ocx/*.pif/*.pl/*.src/*.vb/*.vbs/*.wsf/*.wsh/*.cmd/*.acm/*.dll/*.sys/*.vxd/*.swf/*.jpg/*.gif/*.bmp/
delete veto files = yes
